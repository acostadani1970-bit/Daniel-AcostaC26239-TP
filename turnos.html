<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Pipote - Solitar TURNO</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/coche-con-llave.png">
        <style>       
             /* Contenedor Principal de los Label e Input */
             .contenedor-datos {
                 background-color: white;
                 padding: 30px;
                 border-radius: 8px;
                 box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                 width: 100%;
                 max-width: 700px;
                 margin-left: auto;
                 margin-right: auto;    
                 margin-top: 10%;
             }
             /* Titulo h2 Para el titulo */
             h2 {
                 color: #333;
                 text-align: center;
                 margin-top: 1%;
             }
             
             .datos-formulario {
                 display: flex;
                 align-items: center;
                 gap: 10px;
             }
            
             label {
                 display: inline-block;
                 color: #070606;
                 font-size: 14px;
                 font-weight: bold;
                 text-align: right;
                 width: 150px;          /* Define el mismo tamaño para todos los label */
                 margin-right: 10px;
             }
             
             input, select, textarea {
                 display: inline-block;
                 width: 80%;
                 padding: 10px;
                 border: 1px solid #ccc;
                 border-radius: 4px;
                 box-sizing: border-box;
                 font-size: 14px;
             }
             
             textarea {
                 resize: vertical;
                 height: 80px;
             }
             
             button {
                 width: 40%;
                 padding: 12px;
                 background-color: #007BFF;
                 border: none;
                 color: white;
                 font-size: 16px;
                 border-radius: 4px;
                 cursor: pointer;
                 margin-left: 30%;
                 margin-top: 5%;
             }
             
             button:hover {
                 background-color: #0056b3;
             }
    </style>
</head>
<body>
    <header>
        <div class="contenedor barra-navegacion">
           <div class="logo">Pagina Con Fines Didacticos, Para Curso - Talento Tech </div>

           <nav>
                 <ul class="menu">
                    <li><a href="index.html">Pagina Principal</a></li>
                 </ul>
           </nav>
        </div>
    </header>
   
    <div class="contenedor-datos">
         <h2>Solicitar Turno</h2>
         <form action="https://formspree.io/f/xaeywvnb" method="POST">
             <div class="datos-formulario">
                 <label for="nombre">Nombre y Apellido</label>
                 <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
            </div>

            <div class="datos-formulario">
                 <label for="email">Correo Electronico</label>
                 <input type="email" id="email" name="email" required placeholder="tu@correo.com">
            </div>

            <div class="datos-formulario">
                 <label for="telefono">Telefono</label>
                 <input type="tel" id="telefono" name="telefono" required placeholder="Tu numero de contacto">
            </div>

            <div class="datos-formulario">
                 <label for="servicio">Servicio</label>
                 <select id="servicio" name="servicio" required>
                     <option value="">Seleccione una opción</option>
                     <option value="consulta">Consultas Generales</option>
                     <option value="revision">Cambio Pastillas</option>
                     <option value="especialidad">Cambio Amortiguadores</option>
                 </select>
            </div>

            <div class="datos-formulario">
                 <label for="fecha">Fecha Preferida</label>
                 <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="datos-formulario">
                 <label for="hora">Hora Preferida</label>
                 <input type="time" id="hora" name="hora" required>
            </div>

            <div class="datos-formulario">
                 <label for="comentarios">Observaciones</label>
                 <textarea id="comentarios" name="comentarios" placeholder="Detalles adicionales (opcional)"></textarea>
            </div>

            <button type="submit">Confirmar Turno</button>
         </form>
    </div>
</body>
</html>
