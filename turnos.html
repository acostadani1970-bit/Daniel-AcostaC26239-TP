
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Taller Pipote - Solicitar turno</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/coche-con-llave.png">
</head>

<body>

  <!-- Encabezado -->
  <header>
    <div class="contenedor barra-navegacion">
      <div class="logo">
        Página con fines didácticos - Talento Tech
      </div>

      <nav aria-label="Navegación principal">
        <ul class="menu">
          <li><a href="index.html">Página principal</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="pagina-turnos">
    <section class="contenedor-datos">

      <h1>Solicitar turno</h1>
      <p class="intro-turnos">
        Completá el formulario para solicitar un turno en nuestro taller.
      </p>

      <form
        class="formulario-turnos"
        action="https://formspree.io/f/xaeywvnb"
        method="POST">

        <div class="datos-formulario">
          <label for="nombre">Nombre y apellido</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            autocomplete="name"
            placeholder="Tu nombre completo"
            required>
        </div>

        <div class="datos-formulario">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="tu@correo.com"
            required>
        </div>

        <div class="datos-formulario">
          <label for="telefono">Teléfono</label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            autocomplete="tel"
            placeholder="Tu número de contacto"
            required>
        </div>

        <div class="datos-formulario">
          <label for="servicio">Servicio</label>
          <select id="servicio" name="servicio" required>
            <option value="">Seleccioná una opción</option>
            <option value="consulta">Consultas generales</option>
            <option value="revision">Cambio de pastillas</option>
            <option value="especialidad">Cambio de amortiguadores</option>
          </select>
        </div>

        <div class="datos-formulario">
          <label for="fecha">Fecha preferida</label>
          <input
            type="date"
            id="fecha"
            name="fecha"
            required>
        </div>

        <div class="datos-formulario">
          <label for="hora">Hora preferida</label>
          <input
            type="time"
            id="hora"
            name="hora"
            required>
        </div>

        <div class="datos-formulario">
          <label for="comentarios">Observaciones</label>
          <textarea
            id="comentarios"
            name="comentarios"
            rows="4"
            placeholder="Detalles adicionales (opcional)"></textarea>
        </div>

        <button type="submit" class="boton-enviar">
          Confirmar turno
        </button>

      </form>
    </section>
  </main>

  <!-- Pie de página -->
  <footer class="pie-turnos">
    <p class="copyright">
      &copy; Pepo Software 2026 - Curso Talento Tech
    </p>
  </footer>

</body>
</html>
